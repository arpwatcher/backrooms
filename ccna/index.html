<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA CLI Labs</title>
<meta name="description" content="Mini labs for the CCNA 200-301 commands: type IOS commands and the resulting configuration is checked.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="menu-toggle" id="menu-toggle" aria-label="Lab list">☰</button>
  <a class="brand" href="#"><span class="logo" aria-hidden="true"></span>CCNA <b>CLI Labs</b></a>
  <nav class="views" aria-label="Views">
    <a href="#" data-view="labs">Labs</a>
    <a href="#commands" data-view="commands">Commands</a>
    <a href="#exam" data-view="exam">Exam</a>
  </nav>
  <div class="progress" id="progress" title="Labs completed"></div>
</header>
<div class="layout">
  <aside class="menu" id="menu">
    <input class="search" id="search" type="search" placeholder="Search labs or commands…" aria-label="Search">
    <div id="modules"></div>
  </aside>
  <main id="main"></main>
</div>
<template id="lab-view">
  <section class="lab">
    <div class="lab-head">
      <div>
        <div class="crumbs"></div>
        <h1 class="lab-title"></h1>
      </div>
      <div class="head-right">
        <span class="timer" hidden></span>
      </div>
    </div>
    <div class="work">
      <div class="panel topo-panel">
        <div class="panel-title">Topology <span class="hint-text">click a device to open its console</span></div>
        <svg class="topo" role="img" aria-label="Topology"></svg>
        <div class="pc-info" hidden></div>
      </div>
      <div class="panel tasks-panel">
        <div class="panel-title">Tasks</div>
        <p class="intro"></p>
        <ol class="tasks"></ol>
        <div class="buttons">
          <button class="btn primary check">Check</button>
          <button class="btn theory-btn">Theory</button>
          <button class="btn solution-btn">Answer</button>
          <button class="btn reset-btn" title="Start the lab over">Reset</button>
          <button class="btn next-btn" hidden>Next →</button>
        </div>
        <div class="result" role="status"></div>
        <div class="theory" hidden></div>
        <div class="solution" hidden></div>
      </div>
      <div class="panel term-panel">
        <div class="tabs" role="tablist"></div>
        <div class="screen" tabindex="-1">
          <pre class="out"></pre>
          <div class="input-line"><span class="prompt"></span><input class="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command"></div>
        </div>
        <div class="term-help">Tab: complete · ?: help · ↑↓: history · Ctrl+Z: leave config mode</div>
      </div>
    </div>
  </section>
</template>
<script type="module" src="app.js"></script>
</body>
</html>
